# Demo workload 2: invoice field extraction currently running on GPT-4o.
name: invoice-field-extraction
task_description: >
  Extract structured accounting fields from raw invoice text (OCR output or
  pasted email bodies) for an accounts-payable automation pipeline. Downstream
  systems consume the JSON directly, so field names, date format (YYYY-MM-DD)
  and numeric types must be exact.

prompt_template: |
  Extract structured fields from the invoice text below.
  Return a JSON object with exactly these keys:
  - vendor_name (string)
  - invoice_number (string)
  - invoice_date (string, YYYY-MM-DD)
  - currency (ISO 4217 code, e.g. "USD")
  - total_amount (number, no currency symbol)
  - line_item_count (integer)

  Invoice:
  {input}

max_output_tokens: 200

volume:
  requests_per_day: 12000
  avg_input_tokens: 900
  avg_output_tokens: 120

baseline:
  name: gpt-4o
  input_price_per_mtok: 2.50
  output_price_per_mtok: 10.00

constraints:
  require_valid_json: true
  required_keys: [vendor_name, invoice_number, invoice_date, currency, total_amount, line_item_count]
  max_p95_latency_s: 5.0
  min_cost_reduction_pct: 70
  min_quality_score: 4.2

samples:
  - input: |
      NORTHWIND OFFICE SUPPLY LTD
      14 Harbour Road, Dublin 2, Ireland — VAT IE6388047V

      INVOICE
      Invoice No: NW-2026-04417        Date: 12 August 2026
      Bill to: Meridian Analytics GmbH

      Qty  Description                     Unit      Amount
      12   A4 copier paper (5-ream box)    18.50     222.00
      4    Toner cartridge HP 207X         89.00     356.00
      2    Ergonomic desk chair            249.00    498.00

      Subtotal: 1,076.00
      VAT (23%): 247.48
      TOTAL DUE: EUR 1,323.48
      Payment terms: Net 30
    reference_output: |
      {"vendor_name": "Northwind Office Supply Ltd", "invoice_number": "NW-2026-04417", "invoice_date": "2026-08-12", "currency": "EUR", "total_amount": 1323.48, "line_item_count": 3}

  - input: |
