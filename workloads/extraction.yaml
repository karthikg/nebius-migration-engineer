      Managed Postgres (1 instance) ........... $340.00
      Egress (2.1 TB) ......................... $189.00
      Support plan (Business) ................. $500.00

      Amount due (USD): $2,589.30 by 2026-10-01
    reference_output: |
      {"vendor_name": "CloudSpan Inc.", "invoice_number": "CS-88109", "invoice_date": "2026-09-01", "currency": "USD", "total_amount": 2589.30, "line_item_count": 4}

  - input: |
